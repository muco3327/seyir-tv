plugins { id 'com.android.application' }

def localSigning = new Properties()
def signingFile = rootProject.file('.local/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { localSigning.load(it) }

android {
    namespace 'tv.seyir.app'
    compileSdk 36
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    defaultConfig {
        applicationId 'tv.seyir.app'
        minSdk 26
        targetSdk 35
        versionCode 66
        versionName '0.5.23'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword System.getenv('SEYIR_STORE_PASSWORD') ?: localSigning.getProperty('storePassword')
            keyAlias 'seyir'
            keyPassword System.getenv('SEYIR_KEY_PASSWORD') ?: localSigning.getProperty('keyPassword')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

